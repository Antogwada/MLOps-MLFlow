data:
  raw_csv_path: "data/raw.csv"
  processed_dir: "data/processed"
  target: "Churn"
  test_size: 0.2
  random_state: 42

features:
  numeric:
    - "tenure"
    - "MonthlyCharges"
    - "TotalCharges"
  categorical:
    - "gender"
    - "SeniorCitizen"
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaperlessBilling"
    - "PaymentMethod"

model:
  type: "logreg"  # options: "logreg", "random_forest"
  param_grid:
    classifier__C: [0.1, 1.0, 10.0]
    classifier__solver: ["lbfgs", "liblinear"]
    classifier__max_iter: [500]

cv:
  strategy: "StratifiedKFold"
  n_splits: 5
  scoring: "roc_auc"

mlflow:
  experiment_name: "telco-churn-classifier"
  tracking_uri: "sqlite:///mlflow.db"
  registered_model_name: "ChurnClassifier"
